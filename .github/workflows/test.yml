name: Test

on:
  pull_request:

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.19.0
      # Exact patch rather than a major, and read from a file Dependabot does
      # not touch: bump .node-version by hand when a security release lands.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm i --frozen-lockfile --prefer-offline --strict-peer-dependencies --ignore-scripts
      - name: Format check
        run: pnpm prettier . --check
      - name: Lint
        run: pnpm exec eslint .
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
